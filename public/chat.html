<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ذكاء — مساعدك الذكي</title>
  <meta name="description" content="محادثة ذكية باللغة العربية مدعومة بـ Claude" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <style>
    :root {
      --bg: #f7f7f8;
      --panel: #ffffff;
      --sidebar: #f0f0f3;
      --text: #1d1d22;
      --muted: #6b6b76;
      --border: #e3e3e8;
      --accent: #6d4aff;
      --accent-soft: #efeaff;
      --user-bubble: #6d4aff;
      --user-text: #ffffff;
      --code-bg: #1e1e24;
      --danger: #d64545;
      --shadow: 0 6px 24px rgba(20, 20, 40, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #131317; --panel: #1b1b21; --sidebar: #0f0f13; --text: #ececf1;
        --muted: #9a9aa6; --border: #2a2a33; --accent: #8b6dff; --accent-soft: #241d3d;
        --user-bubble: #3a2d78; --user-text: #f3f0ff; --code-bg: #0c0c10;
        --shadow: 0 6px 24px rgba(0, 0, 0, .35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #131317; --panel: #1b1b21; --sidebar: #0f0f13; --text: #ececf1;
      --muted: #9a9aa6; --border: #2a2a33; --accent: #8b6dff; --accent-soft: #241d3d;
      --user-bubble: #3a2d78; --user-text: #f3f0ff; --code-bg: #0c0c10;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; overflow: hidden; font-size: 16px;
    }
    button { font: inherit; color: inherit; cursor: pointer; }

    /* Sidebar */
    .sidebar {
      width: 280px; flex-shrink: 0; background: var(--sidebar);
      border-inline-end: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 14px; gap: 12px;
      transition: transform .25s ease;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; padding: 4px 6px; }
    .logo {
      width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), #c04bff); color: #fff; font-size: 18px;
    }
    .new-chat {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 11px; font-weight: 600;
    }
    .new-chat:hover { filter: brightness(1.08); }
    .history-label { font-size: 12px; color: var(--muted); padding: 4px 6px 0; }
    .history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .history-item {
      display: flex; align-items: center; gap: 6px; border-radius: 10px;
      padding: 9px 10px; background: transparent; border: 0; text-align: start; width: 100%;
    }
    .history-item:hover { background: var(--border); }
    .history-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .history-item .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; }
    .history-item .del { opacity: 0; border: 0; background: none; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
    .history-item:hover .del { opacity: 1; }
    .history-item .del:hover { color: var(--danger); }
    .sidebar-footer { display: flex; gap: 8px; }
    .icon-btn {
      border: 1px solid var(--border); background: var(--panel); border-radius: 10px;
      padding: 8px 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
    }
    .icon-btn:hover { border-color: var(--accent); }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      border-bottom: 1px solid var(--border); background: var(--panel);
    }
    .menu-btn { display: none; }
    .topbar .spacer { flex: 1; }
    #chatTitle { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    select.model {
      font: inherit; font-size: 14px; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px;
    }

    .chat { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    .chat-inner { max-width: 820px; margin: 0 auto; padding: 24px 16px 12px; display: flex; flex-direction: column; gap: 18px; }

    .empty { text-align: center; padding-top: 8vh; }
    .empty .logo { width: 64px; height: 64px; font-size: 32px; border-radius: 18px; margin: 0 auto 16px; }
    .empty h1 { margin: 0 0 6px; font-size: 28px; }
    .empty p { color: var(--muted); margin: 0 0 28px; }
    .suggestions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; text-align: start; }
    .suggestion {
      border: 1px solid var(--border); background: var(--panel); border-radius: 14px;
      padding: 14px; font-size: 14px; line-height: 1.6; text-align: start;
    }
    .suggestion strong { display: block; margin-bottom: 2px; }
    .suggestion span { color: var(--muted); }
    .suggestion:hover { border-color: var(--accent); box-shadow: var(--shadow); }

    .msg { display: flex; gap: 12px; align-items: flex-start; }
    .msg.user { justify-content: flex-start; flex-direction: row-reverse; }
    .avatar {
      width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), #c04bff); color: #fff; font-size: 16px;
    }
    .msg.user .avatar { display: none; }
    .bubble { line-height: 1.85; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
    .msg.user .bubble {
      background: var(--user-bubble); color: var(--user-text); padding: 10px 16px;
      border-radius: 18px; border-start-end-radius: 6px; max-width: 80%; white-space: pre-wrap;
    }
    .msg.assistant .bubble { flex: 1; padding-top: 3px; }
    .bubble p { margin: 0 0 .8em; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble h1, .bubble h2, .bubble h3 { margin: 1em 0 .5em; line-height: 1.4; }
    .bubble ul, .bubble ol { padding-inline-start: 1.4em; margin: 0 0 .8em; }
    .bubble a { color: var(--accent); }
    .bubble table { border-collapse: collapse; margin: .5em 0 1em; display: block; overflow-x: auto; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; }
    .bubble blockquote { margin: 0 0 .8em; padding-inline-start: 12px; border-inline-start: 3px solid var(--accent); color: var(--muted); }
    .bubble :not(pre) > code { background: var(--accent-soft); padding: 1px 6px; border-radius: 6px; font-size: .9em; }
    .code-wrap { position: relative; margin: 0 0 1em; direction: ltr; }
    .bubble pre {
      background: var(--code-bg); color: #e6e6ef; padding: 14px; border-radius: 12px;
      overflow-x: auto; font-size: 14px; line-height: 1.6; margin: 0; text-align: left;
    }
    .copy-code {
      position: absolute; top: 8px; right: 8px; font-size: 12px; border: 0;
      background: rgba(255,255,255,.12); color: #fff; padding: 4px 8px; border-radius: 6px;
    }
    .msg-actions { display: flex; gap: 6px; margin-top: 8px; }
    .msg-actions button { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 4px 6px; border-radius: 6px; }
    .msg-actions button:hover { background: var(--border); color: var(--text); }
    .error-note { color: var(--danger); font-size: 14px; }

    .typing span {
      display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%;
      background: var(--muted); animation: blink 1.2s infinite both;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

    /* Composer */
    .composer-wrap { padding: 8px 16px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    .composer {
      max-width: 820px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
      padding: 8px 8px 8px 8px; box-shadow: var(--shadow);
    }
    .composer:focus-within { border-color: var(--accent); }
    .composer textarea {
      flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
      font: inherit; line-height: 1.6; max-height: 200px; padding: 8px 10px;
    }
    .send {
      width: 42px; height: 42px; border-radius: 14px; border: 0; flex-shrink: 0;
      background: var(--accent); color: #fff; display: grid; place-items: center;
    }
    .send:disabled { opacity: .4; cursor: not-allowed; }
    .send svg { width: 20px; height: 20px; }
    .disclaimer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 8px; }

    .overlay { display: none; }

    @media (max-width: 800px) {
      .sidebar {
        position: fixed; inset-block: 0; inset-inline-start: 0; z-index: 20;
        transform: translateX(100%); box-shadow: var(--shadow);
      }
      body.sidebar-open .sidebar { transform: translateX(0); }
      body.sidebar-open .overlay { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
      .menu-btn { display: inline-flex; }
      .suggestions { grid-template-columns: 1fr; }
      .msg.user .bubble { max-width: 90%; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">✦</div> ذكاء</div>
    <button class="new-chat" id="newChat">＋ محادثة جديدة</button>
    <div class="history-label">المحادثات السابقة</div>
    <nav class="history" id="history"></nav>
    <div class="sidebar-footer">
      <button class="icon-btn" id="themeBtn" title="تبديل المظهر">◐ المظهر</button>
      <button class="icon-btn" id="clearAll" title="حذف كل المحادثات">🗑 حذف الكل</button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="القائمة">☰</button>
      <strong id="chatTitle">محادثة جديدة</strong>
      <div class="spacer"></div>
      <select class="model" id="model" aria-label="النموذج">
        <option value="claude-opus-5-5">Claude Opus 5.5 — الأذكى</option>
        <option value="claude-sonnet-5-5">Claude Sonnet 5.5 — متوازن</option>
        <option value="claude-haiku-4-5">Claude Haiku 4.5 — الأسرع</option>
      </select>
    </header>

    <section class="chat" id="chat">
      <div class="chat-inner" id="messages"></div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="اكتب رسالتك هنا…" autofocus></textarea>
        <button class="send" id="send" type="submit" aria-label="إرسال" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <div class="disclaimer">قد يخطئ الذكاء الاصطناعي، تحقق من المعلومات المهمة.</div>
    </div>
  </main>

  <script>
    const STORE_KEY = "thaka_chats_v1";
    const SETTINGS_KEY = "thaka_settings_v1";
    const ERRORS = {
      refusal: "عذرًا، لا يمكنني المساعدة في هذا الطلب.",
      rate_limit: "الخادم مشغول حاليًا، حاول مرة أخرى بعد قليل.",
      server_config: "خطأ في إعدادات الخادم (مفتاح API).",
      api: "حدث خطأ أثناء الاتصال بالنموذج.",
      network: "تعذر الاتصال بالخادم. تحقق من اتصالك بالإنترنت.",
      unknown: "حدث خطأ غير متوقع.",
    };
    const SUGGESTIONS = [
      ["اشرح لي", "مفهوم الذكاء الاصطناعي بطريقة بسيطة"],
      ["اكتب", "منشورًا تسويقيًا لمتجر قهوة جديد"],
      ["ساعدني", "في كتابة دالة JavaScript لترتيب مصفوفة"],
      ["اقترح", "خطة لتعلم اللغة الإنجليزية خلال 3 أشهر"],
    ];

    const $ = (id) => document.getElementById(id);
    const els = {
      messages: $("messages"), chat: $("chat"), input: $("input"), send: $("send"),
      composer: $("composer"), history: $("history"), model: $("model"), title: $("chatTitle"),
    };

    const storage = {
      get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
      set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} },
    };

    let chats = storage.get(STORE_KEY, []);
    let settings = storage.get(SETTINGS_KEY, { model: "claude-opus-5-5", theme: null });
    let currentId = null;
    let controller = null;

    const hasMarkdown = !!(window.marked && window.DOMPurify);
    if (hasMarkdown) marked.setOptions({ breaks: true, gfm: true });

    function renderMarkdown(text) {
      if (!hasMarkdown) {
        const div = document.createElement("div");
        div.style.whiteSpace = "pre-wrap"; div.textContent = text;
        return div.outerHTML;
      }
      const html = DOMPurify.sanitize(marked.parse(text));
      const tpl = document.createElement("template");
      tpl.innerHTML = html;
      tpl.content.querySelectorAll("pre").forEach((pre) => {
        const wrap = document.createElement("div");
        wrap.className = "code-wrap";
        pre.replaceWith(wrap);
        wrap.appendChild(pre);
        const btn = document.createElement("button");
        btn.className = "copy-code"; btn.type = "button"; btn.textContent = "نسخ";
        wrap.appendChild(btn);
      });
      tpl.content.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
      return tpl.innerHTML;
    }

    function save() { storage.set(STORE_KEY, chats); }
    function currentChat() { return chats.find((c) => c.id === currentId); }

    function applyTheme() {
      if (settings.theme) document.documentElement.dataset.theme = settings.theme;
      else delete document.documentElement.dataset.theme;
    }

    function renderHistory() {
      els.history.innerHTML = "";
      [...chats].sort((a, b) => b.updated - a.updated).forEach((c) => {
        const item = document.createElement("div");
        item.className = "history-item" + (c.id === currentId ? " active" : "");
        item.setAttribute("role", "button");
        item.tabIndex = 0;
        const t = document.createElement("span");
        t.className = "title"; t.textContent = c.title;
        const del = document.createElement("button");
        del.className = "del"; del.title = "حذف"; del.textContent = "✕";
        del.onclick = (e) => { e.stopPropagation(); deleteChat(c.id); };
        item.append(t, del);
        item.onclick = () => { openChat(c.id); closeSidebar(); };
        els.history.appendChild(item);
      });
    }

    function renderEmpty() {
      els.messages.innerHTML = `
        <div class="empty">
          <div class="logo">✦</div>
          <h1>مرحبًا! كيف يمكنني مساعدتك اليوم؟</h1>
          <p>اسألني أي شيء — كتابة، برمجة، ترجمة، تلخيص، وأكثر.</p>
          <div class="suggestions"></div>
        </div>`;
      const box = els.messages.querySelector(".suggestions");
      SUGGESTIONS.forEach(([a, b]) => {
        const btn = document.createElement("button");
        btn.className = "suggestion"; btn.type = "button";
        btn.innerHTML = `<strong></strong><span></span>`;
        btn.querySelector("strong").textContent = a;
        btn.querySelector("span").textContent = b;
        btn.onclick = () => { els.input.value = `${a} ${b}`; sendMessage(); };
        box.appendChild(btn);
      });
    }

    function messageEl(role, content) {
      const row = document.createElement("div");
      row.className = `msg ${role}`;
      const avatar = document.createElement("div");
      avatar.className = "avatar"; avatar.textContent = "✦";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (role === "user") bubble.textContent = content;
      else bubble.innerHTML = renderMarkdown(content);
      row.append(avatar, bubble);
      return { row, bubble };
    }

    function addActions(bubble, getText) {
      const actions = document.createElement("div");
      actions.className = "msg-actions";
      const copy = document.createElement("button");
      copy.type = "button"; copy.textContent = "⧉ نسخ";
      copy.onclick = async () => {
        try { await navigator.clipboard.writeText(getText()); copy.textContent = "✓ تم النسخ"; }
        catch { copy.textContent = "تعذر النسخ"; }
        setTimeout(() => (copy.textContent = "⧉ نسخ"), 1500);
      };
      actions.appendChild(copy);
      bubble.appendChild(actions);
    }

    function renderChat() {
      const chat = currentChat();
      els.title.textContent = chat ? chat.title : "محادثة جديدة";
      if (!chat || chat.messages.length === 0) { renderEmpty(); return; }
      els.messages.innerHTML = "";
      chat.messages.forEach((m) => {
        const { row, bubble } = messageEl(m.role, m.content);
        if (m.role === "assistant") addActions(bubble, () => m.content);
        els.messages.appendChild(row);
      });
      scrollToBottom(true);
    }

    function scrollToBottom(force) {
      const c = els.chat;
      const near = c.scrollHeight - c.scrollTop - c.clientHeight < 160;
      if (force || near) c.scrollTop = c.scrollHeight;
    }

    function openChat(id) { stopStreaming(); currentId = id; renderHistory(); renderChat(); }
    function newChat() { stopStreaming(); currentId = null; renderHistory(); renderChat(); els.input.focus(); closeSidebar(); }
    function deleteChat(id) {
      chats = chats.filter((c) => c.id !== id); save();
      if (id === currentId) newChat(); else renderHistory();
    }

    function setBusy(busy) {
      els.send.innerHTML = busy
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
      els.send.setAttribute("aria-label", busy ? "إيقاف" : "إرسال");
      updateSendState();
    }
    function updateSendState() { els.send.disabled = !controller && !els.input.value.trim(); }
    function stopStreaming() { if (controller) controller.abort(); }

    async function sendMessage() {
      const text = els.input.value.trim();
      if (!text || controller) return;

      let chat = currentChat();
      if (!chat) {
        chat = { id: Date.now().toString(36) + Math.random().toString(36).slice(2), title: text.slice(0, 40), messages: [], updated: Date.now() };
        chats.push(chat); currentId = chat.id;
      }
      chat.messages.push({ role: "user", content: text });
      chat.updated = Date.now();
      save();
      els.input.value = ""; autoResize();
      renderHistory(); renderChat();

      const { row, bubble } = messageEl("assistant", "");
      bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      els.messages.appendChild(row);
      scrollToBottom(true);

      controller = new AbortController();
      setBusy(true);
      let reply = "";
      let error = null;
      let frame = 0;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ model: els.model.value, messages: chat.messages }),
          signal: controller.signal,
        });
        if (!res.ok || !res.body) throw new Error("http");

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const evt = JSON.parse(line);
            if (evt.t) reply += evt.t;
            if (evt.error) error = evt.error;
          }
          if (reply && !frame) {
            frame = requestAnimationFrame(() => {
              frame = 0;
              bubble.innerHTML = renderMarkdown(reply);
              scrollToBottom();
            });
          }
        }
      } catch (e) {
        if (e.name !== "AbortError") error = e.message === "http" ? "api" : "network";
      } finally {
        controller = null;
        cancelAnimationFrame(frame);
        setBusy(false);
      }

      bubble.innerHTML = reply ? renderMarkdown(reply) : "";
      if (error) {
        const note = document.createElement("div");
        note.className = "error-note";
        note.textContent = ERRORS[error] || ERRORS.unknown;
        bubble.appendChild(note);
      }
      if (reply) {
        chat.messages.push({ role: "assistant", content: reply });
        addActions(bubble, () => reply);
      } else {
        // Keep the conversation strictly alternating: drop the unanswered user turn.
        chat.messages.pop();
        els.input.value = text; autoResize();
      }
      chat.updated = Date.now();
      if (chat.messages.length === 0) chats = chats.filter((c) => c.id !== chat.id);
      save(); renderHistory();
      scrollToBottom();
    }

    function autoResize() {
      els.input.style.height = "auto";
      els.input.style.height = Math.min(els.input.scrollHeight, 200) + "px";
      updateSendState();
    }

    function closeSidebar() { document.body.classList.remove("sidebar-open"); }

    // Events
    els.composer.addEventListener("submit", (e) => {
      e.preventDefault();
      if (controller) stopStreaming(); else sendMessage();
    });
    els.input.addEventListener("input", autoResize);
    els.input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
    });
    els.messages.addEventListener("click", async (e) => {
      const btn = e.target.closest(".copy-code");
      if (!btn) return;
      try { await navigator.clipboard.writeText(btn.parentElement.querySelector("pre").innerText); btn.textContent = "✓"; }
      catch { btn.textContent = "✕"; }
      setTimeout(() => (btn.textContent = "نسخ"), 1500);
    });
    $("newChat").onclick = newChat;
    $("menuBtn").onclick = () => document.body.classList.add("sidebar-open");
    $("overlay").onclick = closeSidebar;
    $("clearAll").onclick = () => {
      if (!chats.length || !confirm("هل تريد حذف كل المحادثات؟")) return;
      chats = []; save(); newChat();
    };
    $("themeBtn").onclick = () => {
      const dark = settings.theme ? settings.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      settings.theme = dark ? "light" : "dark";
      storage.set(SETTINGS_KEY, settings); applyTheme();
    };
    els.model.value = settings.model;
    if (!els.model.value) els.model.value = "claude-opus-5-5";
    els.model.onchange = () => { settings.model = els.model.value; storage.set(SETTINGS_KEY, settings); };

    applyTheme();
    renderHistory();
    renderChat();
  </script>
</body>
</html>
